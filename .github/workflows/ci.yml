name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (tags: checkout v7.0.1, setup-uv v10.3.3)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: make setup
      - run: make -k check

  # Each image installs only its own dependency groups (proposal 009): a top-level import of a
  # package from another group (sentence-transformers, torch) breaks the image build, not `make check`.
  groups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: scripts/check_groups.sh build-image
      - run: scripts/check_groups.sh api-image
