# Defaults for M0. Data-decided parameters (ADR-004/005/006/...) are added only
# when the experiment that decides them has produced a results/*.json file.

[paths]
raw_dir = "data/rerag-data/notebooks"
db_path = "data/noterecall.sqlite"
results_dir = "results"
# The gold set is private (ADR-009): it lives in the data repo, and the owner writes it.
gold_path = "data/rerag-data/gold/gold.json"
# A separate, report-only set for abstention (proposal 007). Never frozen, no dev/test split.
abstention_path = "data/rerag-data/gold/abstention.json"

[logging]
level = "INFO"

[cleaning]
rules_path = "config/cleaning_rules.yaml"
max_output_lines = 20

[tokenizer]
encoding = "cl100k_base"

[chunking]
# ADR-004 candidates. The cap that ships is chosen in M4 by the ADR-010 rule, not here.
candidate_caps = [256, 512, 1024]

[retrieval]
# Pre-registered design parameters (M4 plan): fixed in advance, never tuned.
candidate_depth = 50
fused_depth = 30
final_k = 10
budget_tokens = 3072
sensitivity_budgets = [1536, 6144]
rrf_default = 60
rrf_challengers = [10, 30]
latency_budget_ms = 1000.0

# Candidate embedding models, smallest first. Revisions are the commits of the model repos on
# Hugging Face when they were checked (2026-11-02). Prefixes are the ones each model card documents.
[[embeddings.candidates]]
id = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
query_prefix = "Represent this sentence for searching relevant passages: "
passage_prefix = ""

[[embeddings.candidates]]
id = "BAAI/bge-base-en-v1.5"
revision = "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
query_prefix = "Represent this sentence for searching relevant passages: "
passage_prefix = ""

[[embeddings.candidates]]
id = "intfloat/e5-base-v2"
revision = "f52bf8ec8c7124536f0efb74aca902b2995e5bcd"
query_prefix = "query: "
passage_prefix = "passage: "

[rerank.model]
id = "cross-encoder/ms-marco-MiniLM-L6-v2"
revision = "233902d25c440f23af6f7d6e94d2946bac0bee0a"

[llm]
# OpenAI (proposal 004). The key comes from the OPENAI_API_KEY environment variable.
provider = "openai"
# No M5 step uses it (proposal 005); M6 and M7 do.
model = "gpt-5-mini"
# Lowest effort the API allows for the model; the first real call checks it (a rejection fails loudly).
reasoning_effort = "minimal"
timeout_s = 120.0
max_retries = 3
concurrency = 4
# Hard stop: no call is made once the money actually spent reaches this (M6: $2, owner decision).
max_usd = 2.0
cache_path = "data/llm_cache.sqlite"

# USD per 1M tokens, supplied by the owner.
[llm.prices."gpt-5-mini"]
input = 0.25
cached_input = 0.025
output = 2.00

# Data-decided by the M4 dev ablation (results/retrieval_ablation_dev.json, commit 2b3d953).
# Hybrid of BM25 (code tokenizer) and dense bge-base with RRF k=10, no reranker. The hybrid was
# adopted after the owner reclassified it as free (proposal 003); the reranker failed its rule.
[retrieval.decided]
chunk_cap = 512

[retrieval.decided.pipeline]
lexical = "code"
dense_model = "BAAI/bge-base-en-v1.5"
rrf_k = 10
rerank = false

# The deterministic context header is on (ADR-007 locks it). Its on/off dev row is in
# results/header_ablation_dev.json (report only). The LLM blurb and LLM clean were not run
# (proposal 005).
[retrieval.decided.variant]
header = true

# Grounded Q&A (ADR-011 as amended by proposals 003 and 006). Pre-registered, not tuned: at most 6
# chunks in context (ADR-011); a false-refusal bound of 5% on answerable queries for the stage-1
# calibration (proposal 006); an output cap that includes reasoning tokens.
[generation]
max_chunks = 6
max_output_tokens = 1500
max_false_refusal_pct = 5
# Stage 3, post-answer verification (proposal 007): effort and cap are pre-registered, not tuned.
verify_effort = "medium"
verify_max_output_tokens = 4000
stage3 = false
# tau_cos of the "cosine only" reference row (same calibration, BM25 axis always true).
cosine_only = -0.4020613431930542

# Data-decided by the M6 dev calibration (results/abstention_calibration_dev.json), by the rule
# pre-registered in proposal 006. The rule selected thresholds that refuse nothing: within the 5%
# false-refusal bound (at most 2 of 54 answerable queries) no pair catches any of the 6 unanswerable
# dev queries, so stage 1 is inactive and abstention rests on the model's `insufficient` flag.
[generation.decided]
cosine = -0.4020613431930542
bm25 = -0.45198893547058105
