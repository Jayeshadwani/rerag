[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[project]
name = "noterecall"
version = "0.0.0"
description = "Revision planner over personal notebooks: hybrid retrieval, grounded cards, FSRS scheduling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s==0.3.16",
    "nbformat==5.11.1",
    "numpy==2.5.4",
    "openai==3.42.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "sentence-transformers==6.2.0",
    "structlog==26.1.0",
    "tiktoken==0.14.0",
    "torch==2.15.0",
    "typer==0.27.3",
]

[project.scripts]
noterecall = "noterecall.cli:app"

[dependency-groups]
dev = [
    "hypothesis==6.170.13",
    "mypy==2.4.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.uv]
required-version = "==0.11.32"

# CPU-only torch on Linux (the default PyPI wheel pulls the CUDA libraries); macOS wheels are CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "PL", "RUF", "S", "T20", "PT", "ANN"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["noterecall", "check_banned", "make_fixtures", "render_retrieval"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913"]
"scripts/**" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
mypy_path = "scripts"
# nbformat ships no type hints; calls into it are the only untyped calls we allow.
untyped_calls_exclude = ["nbformat", "bm25s"]

[[tool.mypy.overrides]]
# PyYAML and bm25s ship no type hints and the project may not add stub packages (PLAN section 5).
module = ["yaml", "bm25s"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["scripts"]
markers = ["live: calls real external services; runs only with NOTERECALL_LIVE=1"]

[tool.coverage.run]
source = ["src/noterecall"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
